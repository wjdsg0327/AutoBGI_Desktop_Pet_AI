        hasMore:
          type: boolean
        truncated:
          type: boolean
          description: 首次只返回最近一页时为true，不表示数据库源事件丢失。
        events:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MaterialReadyEvent"
    MaterialReadyEvent:
